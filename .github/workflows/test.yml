name: Run Tests and Coverage

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      run: pip install uv

    - name: Install dependencies
      run: uv sync

    - name: Install test tools (pytest, pytest-cov)
      run: uv run python -m pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        uv run pytest --cov --cov-report=term --cov-report=lcov:coverage.lcov

    - name: Verify coverage is at least 80%
      uses: VeryGoodOpenSource/very_good_coverage@v3
      with:
        path: coverage.lcov
        min_coverage: 80