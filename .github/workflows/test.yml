name: Run Tests and Coverage

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync

    - name: Run tests with coverage
      run: |
        uv run pytest \ --cov=src/api_integration \ --cov-report=term-missing \ --cov-report=lcov:coverage.lcov \ tests/

    - name: Verify coverage is at least 80%
      uses: VeryGoodOpenSource/very_good_coverage@v3
      with:
        path: coverage.lcov
        min_coverage: 80